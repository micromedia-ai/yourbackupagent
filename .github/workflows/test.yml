name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x -S warning kit/backup.sh kit/lib.sh test/run.sh templates/backup-kit-wrapper.sh
      - name: Offline tests (fake Google Cloud)
        run: test/run.sh

name: Backup

# Daily backup of this project with YourBackupAgent
# (github.com/dagangilat/yourbackupagent), settings in backup-kit/backup.env:
#   02:00 UTC every day   run: Firestore (one consistent moment), Storage,
#                         Auth users with password hashes, Realtime Database,
#                         project config -> the project's backup bucket, then
#                         copied to the off-site vault; then check.
#   03:30 UTC on Sundays  drill: restore the newest backup into a temporary
#                         database, compare every count, delete it.
# A failure fails the run, and GitHub emails the repository owner. Logs print
# ids, counts, step names and error messages only.
#
# Copy to .github/workflows/backup.yml and set the deploy key secret name.
on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '30 3 * * 0'
  workflow_dispatch:
    inputs:
      action:
        description: 'run (back up now, then check), check (read-only) or drill (restore drill)'
        type: choice
        options: [run, check, drill]
        default: run

permissions:
  contents: read
  id-token: write   # signing in to Google with Workload Identity (no stored key)

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BACKUP_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
      ACTION: ${{ github.event_name == 'schedule' && (github.event.schedule == '30 3 * * 0' && 'drill' || 'run') || inputs.action }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.DEPLOY_KEY_SECRET_NAME }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Back up
        if: env.ACTION == 'run'
        uses: dagangilat/yourbackupagent@v1
        with:
          command: run

      - name: Restore drill
        if: env.ACTION == 'drill'
        uses: dagangilat/yourbackupagent@v1
        with:
          command: drill

      - name: Check
        if: always() && env.ACTION != 'drill'
        uses: dagangilat/yourbackupagent@v1
        with:
          command: check
